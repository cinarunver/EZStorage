name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --no-configuration-cache --stacktrace 2>&1 | tee build.log

      - name: In-game self test (dedicated server)
        id: selftest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p run/selftest
          echo "eula=true" > run/selftest/eula.txt
          ./gradlew runSelftest --no-configuration-cache 2>&1 | tee selftest.log
          grep -q "\[EZSTORAGE-SELFTEST\] RESULT: PASSED" selftest.log

      - name: In-game client self test (virtual display)
        id: clienttest
        if: steps.selftest.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          mkdir -p run/selftest-client/saves
          cp -r run/selftest/world run/selftest-client/saves/selftest
          printf '%s\n' onboardAccessibility:false pauseOnLostFocus:false skipMultiplayerWarning:true \
            joinedFirstServer:true tutorialStep:none guiScale:3 narrator:0 renderDistance:4 \
            simulationDistance:5 soundCategory_master:0.0 > run/selftest-client/options.txt
          xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runSelftestClient --no-configuration-cache 2>&1 | tee client.log
          grep -q "\[EZSTORAGE-CLIENTTEST\] RESULT: PASSED" client.log

      - name: Upload test logs and screenshots
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-results
          path: |
            selftest.log
            client.log
            run/selftest-client/screenshots/*.png
          if-no-files-found: ignore

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ezstorage-jar
          path: build/libs/*.jar

      - name: Fail if the build or a self test failed
        if: steps.build.outcome == 'failure' || steps.selftest.outcome == 'failure' || steps.clienttest.outcome == 'failure'
        run: exit 1
