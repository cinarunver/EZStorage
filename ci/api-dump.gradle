// Port helper: dumps the public/protected signatures of the classes listed in ci/api-classes.txt
// (javap, signatures only, no code) and lists class names matching "?regex" lines.
// Used while porting to look up the exact 26.2 API; safe to delete afterwards.
tasks.register('dumpApi') {
    group = 'ci'
    def cp = sourceSets.main.compileClasspath
    inputs.files(cp)
    def listFile = file('ci/api-classes.txt')
    def out = layout.buildDirectory.file('api-dump.txt')
    def javapLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    outputs.upToDateWhen { false }
    doLast {
        def outFile = out.get().asFile
        outFile.parentFile.mkdirs()
        def entries = cp.files.findAll { it.exists() }
        def lines = listFile.exists() ? listFile.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') } : []
        def classes = lines.findAll { !it.startsWith('?') }
        def patterns = lines.findAll { it.startsWith('?') }.collect { it.substring(1).trim() }
        def sb = new StringBuilder()
        sb << "# classpath entries: ${entries.size()}\n"
        entries.each { sb << "#  ${it.name}\n" }
        patterns.each { p ->
            def re = java.util.regex.Pattern.compile(p)
            sb << "\n## search: ${p}\n"
            int hits = 0
            entries.findAll { it.isFile() && it.name.endsWith('.jar') }.each { jar ->
                new java.util.zip.ZipFile(jar).withCloseable { zf ->
                    zf.entries().each { e ->
                        if (hits < 400 && e.name.endsWith('.class') && !e.name.contains('$$') && re.matcher(e.name).find()) {
                            sb << "${e.name} (${jar.name})\n"
                            hits++
                        }
                    }
                }
            }
        }
        if (classes) {
            def javap = javapLauncher.get().metadata.installationPath.file('bin/javap').asFile
            def cpString = entries.join(File.pathSeparator)
            classes.collate(30).each { batch ->
                def proc = ([javap.absolutePath, '-protected', '-cp', cpString] + batch).execute()
                def stdout = new StringBuilder()
                def stderr = new StringBuilder()
                proc.waitForProcessOutput(stdout, stderr)
                sb << "\n" << stdout << stderr
            }
        }
        outFile.text = sb.toString()
        println "API dump written to ${outFile}"
    }
}
