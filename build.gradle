plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 25 to end users in 26.2.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    // In-game smoke test run by CI (./gradlew runSelftest). Not part of the mod jar.
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroupByRegex 'net\\.mezzdev\\..*'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        selftest {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.selftest
            gameDirectory = project.file('run/selftest')
            systemProperty 'ezstorage.selftest', 'true'
        }
        selftestClient {
            client()
            sourceSet = sourceSets.selftest
            gameDirectory = project.file('run/selftest-client')
            systemProperty 'ezstorage.selftest.client', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'selftest', '--width', '1280', '--height', '800'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.selftest)

configurations {
    runtimeClasspath.extendsFrom localRuntime
    selftestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI is optional: compile against its API, run the full mod only in dev.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            jei_version            : jei_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Show every error at once instead of stopping at 100.
    options.compilerArgs += ['-Xmaxerrs', '5000', '-Xmaxwarns', '0']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

apply from: 'ci/api-dump.gradle'
